<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog — EduLand</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="preloader"><div class="spinner"></div></div>
    <nav class="navbar-edu">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a href="index.html" class="logo"
          ><i class="bi bi-mortarboard-fill"></i><span>EduLand</span></a
        >
        <ul class="nav-links">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="courses.html">Khóa học</a></li>
          <li><a href="instructors.html">Giảng viên</a></li>
          <li><a href="blog.html" class="active">Blog</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="nav-icon-btn" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <a href="cart.html" class="nav-icon-btn"
            ><i class="bi bi-cart3"></i
            ><span class="cart-badge" id="cartBadge">0</span></a
          >
          <div id="authArea"></div>
          <button class="hamburger" id="hamburger">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <h2 class="section-title">Blog & Tin tức</h2>
        <p class="section-subtitle">Kiến thức bổ ích và xu hướng mới nhất</p>
        <div
          class="d-flex justify-content-center gap-2 mb-4 flex-wrap"
          id="tagFilters"
        ></div>
        <div class="row g-4" id="blogGrid"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; margin: 0; padding: 0">
          © 2024 EduLand. All rights reserved.
        </div>
      </div>
    </footer>
    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
      renderAuthNav();
      const tags = ["Tất cả", ...new Set(BLOGS.map((b) => b.tag))];
      let curTag = "Tất cả";

      function renderTags() {
        document.getElementById("tagFilters").innerHTML = tags
          .map(
            (t) =>
              `<button class="btn-edu-outline tag-btn ${t === curTag ? "btn-edu" : ""}" data-tag="${t}">${t}</button>`,
          )
          .join("");
        document.querySelectorAll(".tag-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            curTag = btn.dataset.tag;
            renderTags();
            renderBlogs();
          });
        });
      }
      function renderBlogs() {
        const list =
          curTag === "Tất cả" ? BLOGS : BLOGS.filter((b) => b.tag === curTag);
        document.getElementById("blogGrid").innerHTML = list
          .map((b) => `<div class="col-md-6 col-lg-4">${blogCardHTML(b)}</div>`)
          .join("");
      }
      renderTags();
      renderBlogs();
    </script>
  </body>
</html>
