<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giỏ hàng — EduLand</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="preloader"><div class="spinner"></div></div>
    <nav class="navbar-edu">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a href="index.html" class="logo"
          ><i class="bi bi-mortarboard-fill"></i><span>EduLand</span></a
        >
        <ul class="nav-links">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="courses.html">Khóa học</a></li>
          <li><a href="instructors.html">Giảng viên</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="nav-icon-btn" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <a href="cart.html" class="nav-icon-btn"
            ><i class="bi bi-cart3"></i
            ><span class="cart-badge" id="cartBadge">0</span></a
          >
          <div id="authArea"></div>
          <button class="hamburger" id="hamburger">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <h2 class="section-title">Giỏ hàng của bạn</h2>
        <div class="row g-4 mt-3">
          <div class="col-lg-8">
            <div id="cartItems"></div>
          </div>
          <div class="col-lg-4">
            <div class="filter-card" style="position: sticky" id="cartSummary">
              <h5 class="mb-3">Tóm tắt đơn hàng</h5>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Tạm tính</span
                ><strong id="subtotal">0đ</strong>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Giảm giá</span
                ><strong class="text-success" id="discount">-0đ</strong>
              </div>
              <hr />
              <div class="d-flex justify-content-between mb-3">
                <strong>Tổng cộng</strong
                ><strong class="price" id="total" style="font-size: 1.3rem"
                  >0đ</strong
                >
              </div>
              <div class="d-flex gap-2 mb-3">
                <input
                  type="text"
                  id="couponInput"
                  class="form-control-edu"
                  placeholder="Mã giảm giá"
                />
                <button class="btn-edu" onclick="applyCoupon()">Áp dụng</button>
              </div>
              <small class="text-muted d-block mb-3"
                >Mã khả dụng: <b>SAVE10</b>, <b>SAVE20</b></small
              >
              <button class="btn-edu w-100" onclick="checkout()">
                <i class="bi bi-credit-card"></i> Thanh toán
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Checkout Modal -->
    <div class="modal-edu-backdrop" id="checkoutModal">
      <div class="modal-edu">
        <div class="icon-circle"><i class="bi bi-credit-card"></i></div>
        <h4>Xác nhận thanh toán</h4>
        <p class="text-muted">Bạn có chắc chắn muốn hoàn tất đơn hàng này?</p>
        <div class="d-flex gap-2 mt-3">
          <button
            class="btn-edu-outline flex-fill"
            onclick="
              document.getElementById('checkoutModal').classList.remove('show')
            "
          >
            Hủy
          </button>
          <button class="btn-edu flex-fill" onclick="confirmCheckout()">
            Xác nhận
          </button>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; margin: 0; padding: 0">
          © 2024 EduLand. All rights reserved.
        </div>
      </div>
    </footer>
    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
      renderAuthNav();
    </script>
  </body>
</html>
