<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập — EduLand</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/dark-mode.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader"><div class="spinner"></div></div>

    <div class="auth-wrap">
      <div class="auth-card">
        <a
          href="../index.html"
          class="logo justify-content-center mb-3"
          style="display: flex"
          ><i class="bi bi-mortarboard-fill"></i><span>EduLand</span></a
        >
        <h2>Đăng nhập</h2>
        <p class="sub">Chào mừng trở lại! Vui lòng nhập thông tin tài khoản</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label-edu">Địa chỉ Email</label>
            <input
              type="email"
              id="loginEmail"
              class="form-control-edu"
              placeholder="email@domain.com"
              required
            />
            <div class="error-msg" id="errLEmail">Vui lòng nhập địa chỉ email hợp lệ</div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label-edu mb-0">Mật khẩu</label>
              <a href="#" onclick="forgotPass(event)" style="font-size: 0.82rem">Quên mật khẩu?</a>
            </div>
            <div class="password-wrap">
              <input
                type="password"
                id="loginPass"
                class="form-control-edu"
                placeholder="Nhập mật khẩu..."
                required
              />
              <button
                type="button"
                class="password-toggle"
                onclick="togglePasswordVisibility('loginPass', this)"
                aria-label="Hiện/Ẩn mật khẩu"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="error-msg" id="errLPass">Email hoặc mật khẩu không chính xác</div>
          </div>

          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="rememberMe" style="accent-color: var(--primary)" />
            <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.88rem; cursor: pointer">
              Ghi nhớ đăng nhập trên thiết bị này
            </label>
          </div>

          <button type="submit" class="btn-edu w-100 mb-3" style="font-size: 1rem">
            <i class="bi bi-box-arrow-in-right"></i> Đăng nhập
          </button>

          <p class="text-center text-muted mb-3" style="font-size: 0.9rem">
            Chưa có tài khoản EduLand?
            <a href="register.html" class="fw-semibold">Đăng ký ngay</a>
          </p>

          <div class="text-center pt-2 border-top">
            <a href="../index.html" class="text-muted" style="font-size: 0.88rem">
              <i class="bi bi-arrow-left"></i> Trở về Trang chủ
            </a>
          </div>
        </form>
      </div>
    </div>

    <script src="../js/auth.js"></script>
    <script src="../js/main.js"></script>
    <script>
      function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector("i");
        if (input.type === "password") {
          input.type = "text";
          icon.className = "bi bi-eye-slash";
        } else {
          input.type = "password";
          icon.className = "bi bi-eye";
        }
      }

      function forgotPass(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        if (email) {
          showToast(`Hướng dẫn đặt lại mật khẩu đã được gửi tới ${email}!`, "info");
        } else {
          showToast("Vui lòng nhập email vào ô phía trên rồi bấm 'Quên mật khẩu'", "info");
        }
      }

      document.getElementById("loginForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value.trim();
        const pass = document.getElementById("loginPass").value;
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        const isEmailInvalid = !re.test(email);
        document.getElementById("errLEmail").classList.toggle("show", isEmailInvalid);
        document.getElementById("loginEmail").classList.toggle("is-invalid", isEmailInvalid);
        document.getElementById("errLPass").classList.remove("show");
        document.getElementById("loginPass").classList.remove("is-invalid");

        if (isEmailInvalid) return;

        const res = loginUser(email, pass);
        if (res.ok) {
          showToast(res.msg, "success");
          setTimeout(() => (location.href = "../index.html"), 700);
        } else {
          const passErr = document.getElementById("errLPass");
          passErr.textContent = res.msg;
          passErr.classList.add("show");
          document.getElementById("loginPass").classList.add("is-invalid");
        }
      });
    </script>
  </body>
</html>
