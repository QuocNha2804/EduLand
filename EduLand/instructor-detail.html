<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết giảng viên — EduLand</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="preloader"><div class="spinner"></div></div>
    <nav class="navbar-edu">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a href="index.html" class="logo"
          ><i class="bi bi-mortarboard-fill"></i><span>EduLand</span></a
        >
        <ul class="nav-links">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="courses.html">Khóa học</a></li>
          <li><a href="instructors.html" class="active">Giảng viên</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <button class="nav-icon-btn" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <a href="cart.html" class="nav-icon-btn"
            ><i class="bi bi-cart3"></i
            ><span class="cart-badge" id="cartBadge">0</span></a
          >
          <div id="authArea"></div>
          <button class="hamburger" id="hamburger">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div id="instInfo"></div>
        <h2 class="section-title mt-5">Khóa học đang dạy</h2>
        <div class="row g-4" id="instCourses"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; margin: 0; padding: 0">
          © 2024 EduLand. All rights reserved.
        </div>
      </div>
    </footer>
    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script>
      renderAuthNav();
      const id = +new URLSearchParams(location.search).get("id") || 1;
      const inst = INSTRUCTORS.find((x) => x.id === id) || INSTRUCTORS[0];

      document.getElementById("instInfo").innerHTML = `
    <div class="row g-4 align-items-center">
      <div class="col-md-3 text-center">
        <div class="instructor-avatar" style="width:160px;height:160px;font-size:3.5rem;margin:0 auto">${inst.name.split(" ").pop().charAt(0)}</div>
      </div>
      <div class="col-md-9">
        <h2>${inst.name}</h2>
        <p class="text-muted mb-2">${inst.role}</p>
        <div class="d-flex gap-4 flex-wrap mb-3">
          <div><strong class="text-primary">${inst.courses}</strong> <small class="text-muted">khóa học</small></div>
          <div><strong class="text-primary">${inst.students.toLocaleString("vi-VN")}</strong> <small class="text-muted">học viên</small></div>
          <div><strong class="text-primary">★ ${inst.rating}</strong> <small class="text-muted">đánh giá</small></div>
        </div>
        <p class="text-muted">${inst.bio}</p>
        <div class="socials mt-3" style="justify-content:flex-start">
          <a href="#"><i class="bi bi-facebook"></i></a><a href="#"><i class="bi bi-twitter-x"></i></a>
          <a href="#"><i class="bi bi-linkedin"></i></a><a href="#"><i class="bi bi-youtube"></i></a>
        </div>
      </div>
    </div>`;

      const list = COURSES.filter((c) => c.instructor === inst.name);
      document.getElementById("instCourses").innerHTML = list.length
        ? list
            .map((c) => `<div class="col-md-4">${courseCardHTML(c)}</div>`)
            .join("")
        : `<div class="col-12 text-center text-muted py-4">Chưa có khóa học nào.</div>`;
    </script>
  </body>
</html>
