<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khóa học — EduLand</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/dark-mode.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div id="preloader"><div class="spinner"></div></div>

    <nav class="navbar-edu">
      <div
        class="container d-flex align-items-center justify-content-between gap-3"
      >
        <a href="index.html" class="logo"
          ><i class="bi bi-mortarboard-fill"></i><span>EduLand</span></a
        >
        <ul class="nav-links">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="courses.html" class="active">Khóa học</a></li>
          <li><a href="instructors.html">Giảng viên</a></li>
          <li><a href="blog.html">Blog</a></li>
          <li><a href="contact.html">Liên hệ</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Tìm khóa học..." />
            <button id="searchBtn"><i class="bi bi-search"></i></button>
          </div>
          <button class="nav-icon-btn" id="themeToggle">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <a href="cart.html" class="nav-icon-btn"
            ><i class="bi bi-cart3"></i
            ><span class="cart-badge" id="cartBadge">0</span></a
          >
          <div id="authArea" class="d-flex align-items-center gap-2"></div>
          <button class="hamburger" id="hamburger">
            <i class="bi bi-list"></i>
          </button>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <h2 class="section-title">Tất cả khóa học</h2>
        <p class="section-subtitle">
          Khám phá hơn 1000+ khóa học chất lượng cao
        </p>

        <div class="row g-4">
          <!-- Sidebar -->
          <div class="col-lg-3">
            <div class="filter-card">
              <h5><i class="bi bi-funnel"></i> Bộ lọc</h5>
              <div class="filter-group">
                <div class="fw-semibold mb-2" style="font-size: 0.92rem">
                  Danh mục
                </div>
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-cat"
                    value="Lập trình"
                  />
                  Lập trình</label
                >
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-cat"
                    value="Data Science"
                  />
                  Data Science</label
                >
                <label class="opt"
                  ><input type="checkbox" class="filter-cat" value="Thiết kế" />
                  Thiết kế</label
                >
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-cat"
                    value="Marketing"
                  />
                  Marketing</label
                >
              </div>
              <div class="filter-group">
                <div class="fw-semibold mb-2" style="font-size: 0.92rem">
                  Cấp độ
                </div>
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-level"
                    value="Beginner"
                  />
                  Beginner</label
                >
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-level"
                    value="Intermediate"
                  />
                  Intermediate</label
                >
                <label class="opt"
                  ><input
                    type="checkbox"
                    class="filter-level"
                    value="Advanced"
                  />
                  Advanced</label
                >
              </div>
              <div class="filter-group">
                <div class="fw-semibold mb-2" style="font-size: 0.92rem">
                  Khoảng giá
                </div>
                <label class="opt"
                  ><input
                    type="radio"
                    name="price"
                    class="filter-price"
                    value="all"
                    checked
                  />
                  Tất cả</label
                >
                <label class="opt"
                  ><input
                    type="radio"
                    name="price"
                    class="filter-price"
                    value="under-1"
                  />
                  Dưới 1 triệu</label
                >
                <label class="opt"
                  ><input
                    type="radio"
                    name="price"
                    class="filter-price"
                    value="1-15"
                  />
                  1 - 1.5 triệu</label
                >
                <label class="opt"
                  ><input
                    type="radio"
                    name="price"
                    class="filter-price"
                    value="over-15"
                  />
                  Trên 1.5 triệu</label
                >
              </div>
              <div class="filter-group">
                <div class="fw-semibold mb-2" style="font-size: 0.92rem">
                  Đánh giá
                </div>
                <label class="opt"
                  ><input
                    type="radio"
                    name="rating"
                    class="filter-rating"
                    value="0"
                    checked
                  />
                  Tất cả</label
                >
                <label class="opt"
                  ><input
                    type="radio"
                    name="rating"
                    class="filter-rating"
                    value="4.8"
                  />
                  ⭐ 4.8+</label
                >
                <label class="opt"
                  ><input
                    type="radio"
                    name="rating"
                    class="filter-rating"
                    value="4.5"
                  />
                  ⭐ 4.5+</label
                >
              </div>
              <button class="btn-edu-outline w-100" onclick="resetFilters()">
                Xóa bộ lọc
              </button>
            </div>
          </div>

          <!-- Main -->
          <div class="col-lg-9">
            <div
              class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2"
            >
              <input
                type="text"
                id="realtimeSearch"
                class="form-control-edu"
                style="max-width: 300px"
                placeholder="🔍 Tìm khóa học realtime..."
              />
              <select
                id="sortSelect"
                class="form-control-edu"
                style="max-width: 220px"
              >
                <option value="newest">Mới nhất</option>
                <option value="price-asc">Giá tăng dần</option>
                <option value="price-desc">Giá giảm dần</option>
                <option value="rating">Rating cao</option>
              </select>
            </div>
            <div class="row g-4" id="courseGrid"></div>
            <div class="pagination-edu" id="pagination"></div>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; margin: 0; padding: 0">
          © 2024 EduLand. All rights reserved.
        </div>
      </div>
    </footer>

    <button id="backToTop"><i class="bi bi-arrow-up"></i></button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script src="js/data.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/main.js"></script>
    <script src="js/courses.js"></script>
    <script>
      AOS.init({ once: true });
      renderAuthNav();
    </script>
  </body>
</html>
